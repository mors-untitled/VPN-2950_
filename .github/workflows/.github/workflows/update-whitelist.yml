name: Update White List VPN configs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect whitelist configs
        shell: python
        run: |
          import urllib.request
          from pathlib import Path

          SOURCES = [
              # CIDR Mobile №1
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt",

              # CIDR Mobile №2
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",

              # Полная CIDR-база
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-all.txt",

              # Полная SNI-база
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-SNI-RU-all.txt",
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          configs = []
          seen = set()

          for url in SOURCES:

              print("Downloading:", url)

              try:
                  req = urllib.request.Request(
                      url,
                      headers=HEADERS
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      text = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

              except Exception as error:

                  print(
                      "FAILED:",
                      url,
                      error
                  )

                  continue

              added = 0

              for raw in text.splitlines():

                  line = raw.strip()

                  if not line.startswith("vless://"):
                      continue

                  if line in seen:
                      continue

                  seen.add(line)
                  configs.append(line)

                  added += 1

              print(
                  "Added:",
                  added
              )

          print(
              "TOTAL UNIQUE:",
              len(configs)
          )

          # -----------------------------------------
          # Output
          # -----------------------------------------

          output = Path("white")

          output.mkdir(
              exist_ok=True
          )

          # Удаляем старые автоматически
          # созданные куски.
          for old in output.glob(
              "white_*.txt"
          ):
              old.unlink()

          CHUNK_SIZE = 100

          chunks = [
              configs[i:i + CHUNK_SIZE]
              for i in range(
                  0,
                  len(configs),
                  CHUNK_SIZE
              )
          ]

          index = []

          for number, chunk in enumerate(
              chunks,
              start=1
          ):

              filename = (
                  f"white_{number:03d}.txt"
              )

              (
                  output / filename
              ).write_text(
                  "\n".join(chunk)
                  + "\n",
                  encoding="utf-8"
              )

              index.append(
                  f"{filename} | "
                  f"{len(chunk)} configs"
              )

              print(
                  filename,
                  len(chunk)
              )

          (
              output / "index.txt"
          ).write_text(
              "\n".join(index)
              + "\n",
              encoding="utf-8"
          )

      - name: Commit updated configs
        run: |
          git config user.name \
          "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add white

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m \
            "Update whitelist VPN configs"

            git push
          fi