name: Collect and split VPN configs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect VPN configs
        shell: python
        run: |
          import base64
          import re
          import urllib.request
          from pathlib import Path

          # ==========================================================
          # PUBLIC SOURCES
          # ==========================================================

          SOURCES = [

              # ------------------------------------------------------
              # Russia / whitelist-oriented sources
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt",

              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile-2.txt",

              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS_mobile.txt",

              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt",

              # ------------------------------------------------------
              # AvenCores
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/26.txt",

              # ------------------------------------------------------
              # V2RayRoot
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/V2RayRoot/V2RayConfig/main/Config/vless.txt",

              "https://raw.githubusercontent.com/V2RayRoot/V2RayConfig/main/Config/vmess.txt",

              "https://raw.githubusercontent.com/V2RayRoot/V2RayConfig/main/Config/shadowsocks.txt",

              # ------------------------------------------------------
              # EbraSha
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_extracted_configs.txt",

              # ------------------------------------------------------
              # Barry-far
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/All_Configs_Sub.txt",

              "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Splitted-By-Protocol/vless.txt",

              "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Splitted-By-Protocol/vmess.txt",

              "https://raw.githubusercontent.com/barry-far/V2ray-Config/main/Splitted-By-Protocol/trojan.txt",

              # ------------------------------------------------------
              # MatinGhanbari
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt",

              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/super-sub.txt",

              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt",

              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vmess.txt",

              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/trojan.txt",

              # ------------------------------------------------------
              # SoliSpirit
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/all_configs.txt",

              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/Subscriptions/Sub1.txt",

              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/Subscriptions/Sub2.txt",

              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/Subscriptions/Sub3.txt",

              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/Subscriptions/Sub4.txt",

              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/Subscriptions/Sub5.txt",

              # ------------------------------------------------------
              # Delta-Kronecker
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/Delta-Kronecker/V2ray-Config/main/sub.txt",

              # ------------------------------------------------------
              # ALIILAPRO
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/ALIILAPRO/v2rayNG-Config/main/server.txt",

              "https://raw.githubusercontent.com/ALIILAPRO/v2rayNG-Config/main/sub.txt",

              # ------------------------------------------------------
              # mahdibland
              # ------------------------------------------------------

              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt",

              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge_base64.txt",

          ]

          PROTOCOLS = (
              "vless://",
              "vmess://",
              "trojan://",
              "ss://",
              "ssr://",
              "hysteria2://",
              "hy2://",
              "tuic://",
          )

          TIMEOUT = 30

          HEADERS = {
              "User-Agent": "Mozilla/5.0 VPN-Collector/2.0",
              "Accept": "*/*",
          }

          def download(url):
              print(f"\n=== {url}")

              try:
                  request = urllib.request.Request(
                      url,
                      headers=HEADERS
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=TIMEOUT
                  ) as response:
                      raw = response.read()

                  print(f"Downloaded: {len(raw)} bytes")

                  return raw.decode(
                      "utf-8",
                      errors="ignore"
                  )

              except Exception as exc:
                  print(f"FAILED: {exc}")
                  return ""

          def decode_base64_if_needed(text):

              if any(proto in text for proto in PROTOCOLS):
                  return text

              compact = "".join(text.split())

              if not compact:
                  return text

              variants = [
                  compact,
                  compact.replace("-", "+").replace("_", "/"),
              ]

              for value in variants:
                  try:
                      value += "=" * (-len(value) % 4)

                      decoded = base64.b64decode(
                          value,
                          validate=False
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if any(
                          proto in decoded
                          for proto in PROTOCOLS
                      ):
                          print("Detected Base64 subscription")
                          return decoded

                  except Exception:
                      pass

              return text

          URI_PATTERN = re.compile(
              r'(?:(?:vless|vmess|trojan|ss|ssr|'
              r'hysteria2|hy2|tuic)://[^\s<>"\']+)'
          )

          def extract(text):

              text = decode_base64_if_needed(text)

              result = []

              for raw_line in text.splitlines():

                  line = raw_line.strip()

                  if not line:
                      continue

                  if line.startswith(PROTOCOLS):
                      result.append(line)
                      continue

                  found = URI_PATTERN.findall(line)

                  result.extend(found)

              return result

          # ==========================================================
          # COLLECT
          # ==========================================================

          configs = []
          seen = set()

          stats = []

          for source in SOURCES:

              text = download(source)

              if not text:
                  stats.append(
                      (source, 0, "FAILED")
                  )
                  continue

              extracted = extract(text)

              added = 0

              for config in extracted:

                  config = config.strip()

                  if not config:
                      continue

                  if config in seen:
                      continue

                  seen.add(config)
                  configs.append(config)

                  added += 1

              stats.append(
                  (source, added, "OK")
              )

              print(
                  f"Unique configs added: {added}"
              )

          # ==========================================================
          # STATS
          # ==========================================================

          print("\n")
          print("=" * 70)
          print("SOURCE STATISTICS")
          print("=" * 70)

          for source, count, status in stats:
              print(
                  f"{status:6} | {count:6} | {source}"
              )

          print("=" * 70)
          print(
              "TOTAL UNIQUE:",
              len(configs)
          )

          # ==========================================================
          # COUNT BY PROTOCOL
          # ==========================================================

          protocol_stats = {}

          for config in configs:

              protocol = config.split(
                  "://",
                  1
              )[0].lower()

              protocol_stats[protocol] = (
                  protocol_stats.get(
                      protocol,
                      0
                  ) + 1
              )

          print("\nPROTOCOL COUNTS")

          for proto, count in sorted(
              protocol_stats.items()
          ):
              print(
                  proto,
                  count
              )

          # ==========================================================
          # OUTPUT DIRECTORIES
          # ==========================================================

          output = Path("configs")

          output.mkdir(
              exist_ok=True
          )

          # Remove old generated chunks
          for old in output.glob(
              "vpn_*.txt"
          ):
              old.unlink()

          # ==========================================================
          # MASTER LIST
          # ==========================================================

          Path(
              "all_configs.txt"
          ).write_text(
              "\n".join(configs)
              + ("\n" if configs else ""),
              encoding="utf-8"
          )

          # ==========================================================
          # SPLIT BY 100
          # ==========================================================

          CHUNK_SIZE = 100

          chunks = [
              configs[i:i + CHUNK_SIZE]
              for i in range(
                  0,
                  len(configs),
                  CHUNK_SIZE
              )
          ]

          index = []

          for number, chunk in enumerate(
              chunks,
              start=1
          ):

              name = (
                  f"vpn_{number:03d}.txt"
              )

              path = output / name

              path.write_text(
                  "\n".join(chunk)
                  + "\n",
                  encoding="utf-8"
              )

              index.append(
                  f"{name} | {len(chunk)}"
              )

              print(
                  name,
                  len(chunk)
              )

          # ==========================================================
          # PROTOCOL-SPECIFIC LISTS
          # ==========================================================

          protocol_dir = Path(
              "protocols"
          )

          protocol_dir.mkdir(
              exist_ok=True
          )

          for old in protocol_dir.glob(
              "*.txt"
          ):
              old.unlink()

          for proto in (
              "vless",
              "vmess",
              "trojan",
              "ss",
              "ssr",
              "hysteria2",
              "hy2",
              "tuic",
          ):

              items = [
                  c
                  for c in configs
                  if c.startswith(
                      proto + "://"
                  )
              ]

              if not items:
                  continue

              (
                  protocol_dir
                  / f"{proto}.txt"
              ).write_text(
                  "\n".join(items)
                  + "\n",
                  encoding="utf-8"
              )

          # ==========================================================
          # INDEX
          # ==========================================================

          Path(
              "configs/index.txt"
          ).write_text(
              "\n".join(index)
              + ("\n" if index else ""),
              encoding="utf-8"
          )

          Path(
              "stats.txt"
          ).write_text(
              "\n".join(
                  [
                      f"Total unique: {len(configs)}",
                      f"Chunks: {len(chunks)}",
                      "",
                      *[
                          f"{proto}: {count}"
                          for proto, count
                          in sorted(
                              protocol_stats.items()
                          )
                      ]
                  ]
              ) + "\n",
              encoding="utf-8"
          )

          print("\nDONE")
          print(
              "Chunks generated:",
              len(chunks)
          )

      - name: Commit generated lists
        run: |
          git config user.name \
          "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            configs \
            protocols \
            all_configs.txt \
            stats.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m \
            "Update aggregated VPN configs"

            git push
          fi