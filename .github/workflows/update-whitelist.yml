name: Update split 26 configs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/9 * * * *"

permissions:
  contents: write

concurrency:
  group: update-26-split
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest 26.txt
        run: |
          curl -L --fail --retry 3 \
          "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/26.txt" \
          -o source.txt

      - name: Split configs into two equal parts
        shell: python
        run: |
          from pathlib import Path

          source = Path("source.txt")

          configs = [
              line.strip()
              for line in source.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines()
              if line.strip()
          ]

          total = len(configs)

          # При нечётном количестве первая часть получит
          # на одну конфигурацию больше.
          middle = (total + 1) // 2

          part1 = configs[:middle]
          part2 = configs[middle:]

          Path("26_part_1.txt").write_text(
              "\n".join(part1) + ("\n" if part1 else ""),
              encoding="utf-8"
          )

          Path("26_part_2.txt").write_text(
              "\n".join(part2) + ("\n" if part2 else ""),
              encoding="utf-8"
          )

          print(f"Total configs: {total}")
          print(f"Part 1: {len(part1)}")
          print(f"Part 2: {len(part2)}")

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add 26_part_1.txt 26_part_2.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update split 26 configs"
            git push
          fi