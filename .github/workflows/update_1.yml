name: Update Kaluga matched VPN configs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest configs
        run: |
          curl -L --fail \
          "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/26.txt" \
          -o source.txt

      - name: Find configs similar to confirmed working keys
        shell: python
        run: |
          import urllib.parse
          from pathlib import Path

          SOURCE = Path("source.txt")

          # SNI, которые присутствуют в подтверждённо рабочих
          # у пользователя ключах.
          CONFIRMED_SNI = {
              "rutube.ru",
              "ads.x5.ru",
          }

          # Доменные семейства подтверждённых SNI.
          PREFERRED_SUFFIXES = (
              "rutube.ru",
              "x5.ru",
          )

          def first(query, key):
              return query.get(key, [""])[0].lower().strip()

          def get_sni(query):
              sni = first(query, "sni")
              if not sni:
                  sni = first(query, "servername")
              return urllib.parse.unquote(sni).lower().strip(".")

          def sni_suffix_match(sni):
              return any(
                  sni == suffix or sni.endswith("." + suffix)
                  for suffix in PREFERRED_SUFFIXES
              )

          configs = []
          seen = set()

          for index, raw in enumerate(
              SOURCE.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines()
          ):
              line = raw.strip()

              if not line.startswith("vless://"):
                  continue

              # Убираем точные дубли.
              if line in seen:
                  continue
              seen.add(line)

              try:
                  parsed = urllib.parse.urlsplit(line)
                  query = urllib.parse.parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )
              except Exception:
                  continue

              security = first(query, "security")
              flow = first(query, "flow")
              transport = first(query, "type")
              fp = first(query, "fp")
              sni = get_sni(query)

              try:
                  port = parsed.port or 0
              except Exception:
                  port = 0

              score = 0
              reasons = []

              # Уже оставляем только VLESS.
              score += 5
              reasons.append("VLESS")

              # Очень сильные совпадения с рабочими ключами.
              if security == "reality":
                  score += 12
                  reasons.append("REALITY")

              if flow == "xtls-rprx-vision":
                  score += 10
                  reasons.append("VISION")

              if transport in ("tcp", "raw"):
                  score += 7
                  reasons.append("TCP/RAW")

              # В подтверждённых ключах используется qq.
              # Но не делаем его обязательным.
              if fp == "qq":
                  score += 5
                  reasons.append("FP=QQ")
              elif fp in ("chrome", "firefox", "safari"):
                  score += 2

              # Самый сильный признак:
              # SNI совпадает с уже рабочими вариантами.
              if sni in CONFIRMED_SNI:
                  score += 25
                  reasons.append("CONFIRMED-SNI")

              elif sni_suffix_match(sni):
                  score += 18
                  reasons.append("SNI-FAMILY")

              # Порты из рабочих образцов.
              # Небольшой бонус, потому что сам по себе порт
              # практически ничего не гарантирует.
              if port in (9443, 55443):
                  score += 2
                  reasons.append("KNOWN-PORT")

              configs.append({
                  "score": score,
                  "index": index,
                  "line": line,
                  "sni": sni,
                  "reasons": reasons,
              })

          # Лучшие совпадения идут первыми.
          # При одинаковом score сохраняем порядок источника.
          configs.sort(
              key=lambda x: (-x["score"], x["index"])
          )

          # Очень похожие на подтверждённо рабочие.
          strong = [
              c for c in configs
              if c["score"] >= 39
          ]

          # Более широкий пул.
          probable = [
              c for c in configs
              if c["score"] >= 30
          ]

          # Главный компактный список для Karing.
          best_300 = probable[:300]

          # Более широкий запасной список.
          best_700 = probable[:700]

          Path("kaluga_best_300.txt").write_text(
              "\n".join(c["line"] for c in best_300)
              + ("\n" if best_300 else ""),
              encoding="utf-8"
          )

          Path("kaluga_best_700.txt").write_text(
              "\n".join(c["line"] for c in best_700)
              + ("\n" if best_700 else ""),
              encoding="utf-8"
          )

          Path("kaluga_strong_matches.txt").write_text(
              "\n".join(c["line"] for c in strong)
              + ("\n" if strong else ""),
              encoding="utf-8"
          )

          # Диагностика в GitHub Actions.
          print("Total unique VLESS:", len(configs))
          print("Strong matches:", len(strong))
          print("Probable matches:", len(probable))
          print("Best 300:", len(best_300))
          print("Best 700:", len(best_700))

          print("\nTOP 20:")
          for c in configs[:20]:
              print(
                  c["score"],
                  c["sni"],
                  ",".join(c["reasons"])
              )

      - name: Commit updated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            kaluga_best_300.txt \
            kaluga_best_700.txt \
            kaluga_strong_matches.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Kaluga matched VPN configs"
            git push
          fi