name: Web Whitelist VPN Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: web-whitelist-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect VLESS configs from public websites
        run: |
          cat > /tmp/collector.py <<'PY'
          import re
          import time
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlparse, parse_qs

          import requests
          from bs4 import BeautifulSoup


          # =========================================================
          # SETTINGS
          # =========================================================

          MAX_SERVER_PAGES = 1000
          MAX_LIST_PAGES = 120

          REQUEST_TIMEOUT = 12
          REQUEST_DELAY = 0.15

          BATCH_SIZE = 100

          OUT_DIR = Path("web_configs")

          PRIORITY_SNI = {
              "max.ru",
              "st.vk.com",
              "music.yandex.ru",
              "event.yandex.ru",
              "ads.x5.ru",
          }


          START_PAGES = [
              "https://www.v2nodes.com/",
              "https://www.v2nodes.com/country/de/",
              "https://www.v2nodes.com/country/nl/",
              "https://www.v2nodes.com/country/fi/",
              "https://www.v2nodes.com/country/pl/",
              "https://www.v2nodes.com/country/lv/",
              "https://www.v2nodes.com/country/se/",
              "https://www.v2nodes.com/country/fr/",
              "https://www.v2nodes.com/country/at/",
              "https://www.v2nodes.com/country/be/",
              "https://www.v2nodes.com/country/ee/",
              "https://www.v2nodes.com/country/lt/",
              "https://www.v2nodes.com/country/cz/",
          ]


          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 "
                  "Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
          }


          session = requests.Session()
          session.headers.update(HEADERS)


          VLESS_RE = re.compile(
              r'vless://[^\s<>"\'\\]+',
              re.I
          )

          SERVER_LINK_RE = re.compile(
              r'^/servers/\d+/?$',
              re.I
          )


          # =========================================================
          # HTTP
          # =========================================================

          def fetch(url):
              try:
                  r = session.get(
                      url,
                      timeout=REQUEST_TIMEOUT,
                      allow_redirects=True
                  )

                  print(
                      f"GET {url} -> {r.status_code} "
                      f"{len(r.content)} bytes",
                      flush=True
                  )

                  if r.status_code != 200:
                      return ""

                  return r.text

              except Exception as exc:
                  print(
                      f"FAILED {url}: {exc}",
                      flush=True
                  )
                  return ""


          # =========================================================
          # URI CLEANUP
          # =========================================================

          def clean_uri(uri):
              uri = uri.strip()

              # remove common trailing HTML punctuation
              uri = uri.rstrip(
                  ".,;)]}>'\""
              )

              return uri


          def extract_vless(text):
              if not text:
                  return []

              found = []

              for uri in VLESS_RE.findall(text):
                  uri = clean_uri(uri)

                  if uri.lower().startswith("vless://"):
                      found.append(uri)

              return found


          # =========================================================
          # V2NODES SERVER DISCOVERY
          # =========================================================

          def find_server_links(base_url, html):
              result = []

              try:
                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  for a in soup.find_all(
                      "a",
                      href=True
                  ):
                      href = a["href"].strip()

                      parsed = urlparse(href)

                      # absolute link
                      if parsed.scheme in (
                          "http",
                          "https"
                      ):
                          path = parsed.path

                          if (
                              parsed.netloc.lower()
                              != "www.v2nodes.com"
                          ):
                              continue

                      else:
                          path = parsed.path

                      if not SERVER_LINK_RE.match(
                          path
                      ):
                          continue

                      url = urljoin(
                          base_url,
                          path
                      )

                      result.append(url)

              except Exception as exc:
                  print(
                      "LINK PARSE ERROR:",
                      exc,
                      flush=True
                  )

              return list(
                  dict.fromkeys(result)
              )


          # =========================================================
          # PAGINATION DISCOVERY
          # =========================================================

          def find_list_pages(
              base_url,
              html
          ):
              result = []

              try:
                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  root_host = urlparse(
                      base_url
                  ).netloc.lower()

                  for a in soup.find_all(
                      "a",
                      href=True
                  ):
                      href = a["href"].strip()

                      url = urljoin(
                          base_url,
                          href
                      )

                      parsed = urlparse(url)

                      if (
                          parsed.netloc.lower()
                          != root_host
                      ):
                          continue

                      lower = url.lower()

                      # pagination patterns
                      if (
                          "page=" in lower
                          or "/page/" in lower
                      ):
                          result.append(url)

              except Exception:
                  pass

              return list(
                  dict.fromkeys(result)
              )


          # =========================================================
          # VLESS PARSING
          # =========================================================

          def get_param(uri, name):
              try:
                  parsed = urlparse(uri)

                  query = parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  value = query.get(name)

                  if not value:
                      return ""

                  return unquote(
                      value[0]
                  ).lower().strip()

              except Exception:
                  return ""


          def server_host(uri):
              try:
                  parsed = urlparse(uri)
                  return parsed.hostname or ""
              except Exception:
                  return ""


          def server_port(uri):
              try:
                  parsed = urlparse(uri)
                  return parsed.port or 0
              except Exception:
                  return 0


          # =========================================================
          # SCORING
          # =========================================================

          def score(uri):
              result = 0

              security = get_param(
                  uri,
                  "security"
              )

              sni = get_param(
                  uri,
                  "sni"
              )

              transport = get_param(
                  uri,
                  "type"
              )

              flow = get_param(
                  uri,
                  "flow"
              )

              fp = get_param(
                  uri,
                  "fp"
              )

              sid = get_param(
                  uri,
                  "sid"
              )

              port = server_port(uri)

              # Reality is our main target
              if security == "reality":
                  result += 200
              else:
                  result -= 100

              # confirmed patterns from your working configs
              if transport == "grpc":
                  result += 60

              elif transport in (
                  "tcp",
                  "raw"
              ):
                  result += 35

              if flow == "xtls-rprx-vision":
                  result += 50

              # whitelist-looking SNI
              if sni in PRIORITY_SNI:
                  result += 150

              if sni == "max.ru":
                  result += 100

              # common useful port
              if port == 443:
                  result += 25

              # REALITY short ID exists
              if sid:
                  result += 10

              # fingerprint is low priority
              if fp in {
                  "chrome",
                  "firefox",
                  "edge",
                  "safari",
                  "qq",
                  "random",
              }:
                  result += 3

              return result


          # =========================================================
          # COLLECT LIST PAGES
          # =========================================================

          list_pages = []
          list_seen = set()

          queue = list(START_PAGES)

          while (
              queue
              and len(list_pages)
              < MAX_LIST_PAGES
          ):
              url = queue.pop(0)

              if url in list_seen:
                  continue

              list_seen.add(url)
              list_pages.append(url)

              html = fetch(url)

              if not html:
                  continue

              for page in find_list_pages(
                  url,
                  html
              ):
                  if (
                      page not in list_seen
                      and page not in queue
                  ):
                      queue.append(page)

              time.sleep(
                  REQUEST_DELAY
              )


          print(
              f"List pages discovered: "
              f"{len(list_pages)}",
              flush=True
          )


          # =========================================================
          # COLLECT SERVER PAGE URLS
          # =========================================================

          server_urls = []
          server_seen = set()

          for list_url in list_pages:

              if len(
                  server_urls
              ) >= MAX_SERVER_PAGES:
                  break

              html = fetch(
                  list_url
              )

              if not html:
                  continue

              links = find_server_links(
                  list_url,
                  html
              )

              for url in links:

                  if url in server_seen:
                      continue

                  server_seen.add(url)
                  server_urls.append(url)

                  if (
                      len(server_urls)
                      >= MAX_SERVER_PAGES
                  ):
                      break

              print(
                  f"Server pages: "
                  f"{len(server_urls)}",
                  flush=True
              )

              time.sleep(
                  REQUEST_DELAY
              )


          print(
              f"Total server pages queued: "
              f"{len(server_urls)}",
              flush=True
          )


          # =========================================================
          # DOWNLOAD EACH SERVER PAGE
          # =========================================================

          configs = []

          for index, url in enumerate(
              server_urls,
              start=1
          ):

              html = fetch(url)

              if not html:
                  continue

              found = extract_vless(
                  html
              )

              configs.extend(
                  found
              )

              if (
                  index % 25
                  == 0
              ):
                  print(
                      f"Processed "
                      f"{index}/"
                      f"{len(server_urls)} "
                      f"| raw configs="
                      f"{len(configs)}",
                      flush=True
                  )

              time.sleep(
                  REQUEST_DELAY
              )


          # =========================================================
          # DEDUPLICATE
          # =========================================================

          unique = []
          seen = set()

          for uri in configs:

              if uri in seen:
                  continue

              seen.add(uri)
              unique.append(uri)


          # =========================================================
          # GROUPS
          # =========================================================

          ranked = sorted(
              unique,
              key=score,
              reverse=True
          )


          reality = [
              uri
              for uri in ranked
              if get_param(
                  uri,
                  "security"
              ) == "reality"
          ]


          priority_sni = [
              uri
              for uri in reality
              if get_param(
                  uri,
                  "sni"
              ) in PRIORITY_SNI
          ]


          max_ru = [
              uri
              for uri in reality
              if get_param(
                  uri,
                  "sni"
              ) == "max.ru"
          ]


          reality_443 = [
              uri
              for uri in reality
              if server_port(
                  uri
              ) == 443
          ]


          grpc_reality = [
              uri
              for uri in reality
              if get_param(
                  uri,
                  "type"
              ) == "grpc"
          ]


          vision_reality = [
              uri
              for uri in reality
              if get_param(
                  uri,
                  "flow"
              ) == "xtls-rprx-vision"
          ]


          # =========================================================
          # OUTPUT
          # =========================================================

          OUT_DIR.mkdir(
              exist_ok=True
          )


          for old in OUT_DIR.glob(
              "*.txt"
          ):
              old.unlink()


          def save(
              filename,
              data
          ):
              (
                  OUT_DIR
                  / filename
              ).write_text(
                  "\n".join(data)
                  + (
                      "\n"
                      if data
                      else ""
                  ),
                  encoding="utf-8"
              )


          save(
              "01_max_ru.txt",
              max_ru
          )

          save(
              "02_priority_sni.txt",
              priority_sni
          )

          save(
              "03_reality_443.txt",
              reality_443
          )

          save(
              "04_grpc_reality.txt",
              grpc_reality
          )

          save(
              "05_vision_reality.txt",
              vision_reality
          )

          save(
              "06_reality_all.txt",
              reality
          )

          save(
              "07_vless_all.txt",
              ranked
          )

          # compatibility with whitelist-filter workflow
          save(
              "04_vless_all.txt",
              ranked
          )


          # =========================================================
          # TEST BATCHES
          # =========================================================

          for old in OUT_DIR.glob(
              "test_*.txt"
          ):
              old.unlink()


          # priority:
          # whitelist SNI first,
          # then all Reality
          test_pool = []

          test_seen = set()

          for uri in (
              priority_sni
              + reality
          ):
              if uri not in test_seen:
                  test_seen.add(uri)
                  test_pool.append(uri)


          for start in range(
              0,
              len(test_pool),
              BATCH_SIZE
          ):
              chunk = test_pool[
                  start:
                  start + BATCH_SIZE
              ]

              number = (
                  start
                  // BATCH_SIZE
              ) + 1

              save(
                  f"test_{number:03d}.txt",
                  chunk
              )


          # =========================================================
          # REPORT
          # =========================================================

          report = [
              f"List pages: {len(list_pages)}",
              f"Server pages: {len(server_urls)}",
              f"Unique VLESS: {len(unique)}",
              f"REALITY: {len(reality)}",
              f"REALITY port 443: {len(reality_443)}",
              f"gRPC REALITY: {len(grpc_reality)}",
              f"Vision REALITY: {len(vision_reality)}",
              f"Priority whitelist SNI: {len(priority_sni)}",
              f"max.ru: {len(max_ru)}",
              "",
              "TOP 100",
          ]


          for uri in ranked[:100]:

              report.append(
                  f"{score(uri):4} | "
                  f"{server_host(uri)}:"
                  f"{server_port(uri)} | "
                  f"SNI="
                  f"{get_param(uri, 'sni') or '-'} | "
                  f"security="
                  f"{get_param(uri, 'security') or '-'} | "
                  f"type="
                  f"{get_param(uri, 'type') or '-'} | "
                  f"flow="
                  f"{get_param(uri, 'flow') or '-'}"
              )


          save(
              "report.txt",
              report
          )


          print()
          print("DONE")
          print(
              "List pages:",
              len(list_pages)
          )
          print(
              "Server pages:",
              len(server_urls)
          )
          print(
              "Unique VLESS:",
              len(unique)
          )
          print(
              "REALITY:",
              len(reality)
          )
          print(
              "Priority SNI:",
              len(priority_sni)
          )
          print(
              "max.ru:",
              len(max_ru)
          )

          PY

          python /tmp/collector.py

      - name: Commit updated web configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add web_configs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m \
              "Update targeted V2Nodes VLESS collection"
            git push
          fi