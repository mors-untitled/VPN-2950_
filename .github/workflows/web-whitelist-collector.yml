name: Web Whitelist VPN Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: web-whitelist-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect configs from public websites
        run: |
          cat > /tmp/collector.py <<'PY'
          import base64
          import html
          import re
          import time
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup


          # ==========================================================
          # WEBSITES ONLY
          # No GitHub repositories are used as input here.
          # ==========================================================

          START_PAGES = [
              # V2Nodes
              "https://www.v2nodes.com/",
              "https://www.v2nodes.com/country/de/",
              "https://www.v2nodes.com/country/nl/",
              "https://www.v2nodes.com/country/fi/",
              "https://www.v2nodes.com/country/pl/",
              "https://www.v2nodes.com/country/lv/",

              # SSHStores public VLESS pages
              "https://sshstores.net/vless",
              "https://sshstores.net/vless-grpc",
              "https://sshstores.net/vless/united-states",

              # FreeVPN.us
              "https://www.freevpn.us/v2ray/",
          ]


          # ==========================================================
          # What we learned from confirmed working configs
          # ==========================================================

          PRIORITY_SNI = [
              "max.ru",
              "st.vk.com",
              "music.yandex.ru",
              "event.yandex.ru",
              "ads.x5.ru",
          ]

          # max.ru gets much higher priority because it was repeatedly
          # confirmed working across independent endpoints.
          SNI_SCORE = {
              "max.ru": 100,
              "st.vk.com": 35,
              "music.yandex.ru": 35,
              "event.yandex.ru": 35,
              "ads.x5.ru": 35,
          }


          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;"
                  "q=0.9,*/*;q=0.8"
              ),
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          TIMEOUT = 20

          # Don't turn this into a huge crawler.
          MAX_LINKS_PER_SITE = 40


          # ==========================================================
          # Extraction
          # ==========================================================

          URI_RE = re.compile(
              r'(?:vless|vmess|trojan|ss|ssr|hy2|hysteria2|tuic)'
              r'://[^\s<>"\'\\]+',
              re.I
          )


          def clean_uri(uri):
              uri = html.unescape(uri)
              uri = unquote(uri)

              # Remove common HTML / JS garbage at the end.
              uri = uri.rstrip(
                  ".,;)]}>'\""
              )

              return uri.strip()


          def extract_uris(text):
              results = []

              if not text:
                  return results

              # Raw text
              for value in URI_RE.findall(text):
                  results.append(clean_uri(value))

              # URL-decoded representation
              decoded = unquote(text)

              if decoded != text:
                  for value in URI_RE.findall(decoded):
                      results.append(clean_uri(value))

              # HTML-decoded representation
              decoded_html = html.unescape(text)

              if decoded_html != text:
                  for value in URI_RE.findall(decoded_html):
                      results.append(clean_uri(value))

              return results


          def try_base64(text):
              """
              Some websites expose subscription blobs as base64.
              """
              candidates = []

              for block in re.findall(
                  r'[A-Za-z0-9_\-+/=]{80,}',
                  text
              ):
                  try:
                      value = block.replace("-", "+").replace("_", "/")
                      value += "=" * (-len(value) % 4)

                      decoded = base64.b64decode(
                          value,
                          validate=False
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      if "vless://" in decoded.lower():
                          candidates.extend(
                              extract_uris(decoded)
                          )

                  except Exception:
                      pass

              return candidates


          # ==========================================================
          # Download
          # ==========================================================

          def fetch(url):
              try:
                  print(f"GET {url}")

                  r = SESSION.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  print(
                      " ->",
                      r.status_code,
                      len(r.content),
                      r.url
                  )

                  if r.status_code != 200:
                      return None, None

                  return r.text, r.url

              except Exception as exc:
                  print("FAILED:", exc)
                  return None, None


          # ==========================================================
          # Same-site crawler
          # ==========================================================

          def same_site_links(page_url, text):
              result = []

              try:
                  soup = BeautifulSoup(
                      text,
                      "html.parser"
                  )

                  root_host = urlparse(page_url).netloc.lower()

                  for tag in soup.find_all(
                      ["a", "link", "script"]
                  ):

                      target = (
                          tag.get("href")
                          or tag.get("src")
                      )

                      if not target:
                          continue

                      url = urljoin(
                          page_url,
                          target
                      )

                      parsed = urlparse(url)

                      if parsed.scheme not in (
                          "http",
                          "https"
                      ):
                          continue

                      if parsed.netloc.lower() != root_host:
                          continue

                      lower = url.lower()

                      # Only follow pages likely to contain configs.
                      keywords = (
                          "vless",
                          "v2ray",
                          "config",
                          "node",
                          "server",
                          "subscription",
                          "country",
                          "reality",
                          "grpc",
                      )

                      if not any(
                          word in lower
                          for word in keywords
                      ):
                          continue

                      result.append(url)

              except Exception:
                  pass

              # preserve order + deduplicate
              return list(
                  dict.fromkeys(result)
              )[:MAX_LINKS_PER_SITE]


          # ==========================================================
          # VLESS analysis
          # ==========================================================

          def param(uri, name):
              match = re.search(
                  rf'(?:[?&]){re.escape(name)}=([^&#]+)',
                  uri,
                  flags=re.I
              )

              if not match:
                  return ""

              return unquote(
                  match.group(1)
              ).lower()


          def score_vless(uri):
              """
              Ranking only.
              We DO NOT modify the URI.
              """

              lower = uri.lower()

              if not lower.startswith(
                  "vless://"
              ):
                  return -10000

              score = 10

              security = param(
                  uri,
                  "security"
              )

              transport = param(
                  uri,
                  "type"
              )

              sni = param(
                  uri,
                  "sni"
              )

              flow = param(
                  uri,
                  "flow"
              )

              fp = param(
                  uri,
                  "fp"
              )

              # REALITY was present in essentially all
              # confirmed working examples.
              if security == "reality":
                  score += 100
              else:
                  score -= 80

              # Confirmed useful transports.
              if transport == "grpc":
                  score += 35

              elif transport in (
                  "tcp",
                  "raw"
              ):
                  score += 20

              # Vision is another confirmed working pattern.
              if "xtls-rprx-vision" in flow:
                  score += 35

              # SNI
              if sni in SNI_SCORE:
                  score += SNI_SCORE[sni]

              # Port 443 appeared very frequently.
              if re.search(
                  r'@[^\s/:?#]+:443(?:[/?#])',
                  uri
              ):
                  score += 15

              # Fingerprint is intentionally LOW weight.
              # We already observed working chrome/firefox/edge/
              # safari/qq/random fingerprints.
              if fp in (
                  "chrome",
                  "firefox",
                  "edge",
                  "safari",
                  "qq",
                  "random",
              ):
                  score += 2

              return score


          def describe(uri):
              return {
                  "score": score_vless(uri),
                  "sni": param(uri, "sni"),
                  "security": param(uri, "security"),
                  "transport": param(uri, "type"),
                  "flow": param(uri, "flow"),
                  "fp": param(uri, "fp"),
              }


          # ==========================================================
          # Crawl
          # ==========================================================

          all_configs = []
          source_stats = {}

          visited = set()
          queue = list(START_PAGES)

          while queue:

              url = queue.pop(0)

              if url in visited:
                  continue

              visited.add(url)

              text, final_url = fetch(url)

              if not text:
                  continue

              found = []

              found.extend(
                  extract_uris(text)
              )

              found.extend(
                  try_base64(text)
              )

              # Also inspect HTML attributes and script contents.
              try:
                  soup = BeautifulSoup(
                      text,
                      "html.parser"
                  )

                  found.extend(
                      extract_uris(
                          soup.get_text(
                              "\n"
                          )
                      )
                  )

                  for tag in soup.find_all(True):
                      for value in tag.attrs.values():

                          if isinstance(
                              value,
                              str
                          ):
                              found.extend(
                                  extract_uris(value)
                              )

                          elif isinstance(
                              value,
                              list
                          ):
                              for item in value:
                                  if isinstance(
                                      item,
                                      str
                                  ):
                                      found.extend(
                                          extract_uris(item)
                                      )

              except Exception:
                  pass

              found = [
                  clean_uri(x)
                  for x in found
                  if x
              ]

              source_stats[url] = len(found)

              all_configs.extend(
                  found
              )

              # Follow relevant links from the site.
              for link in same_site_links(
                  final_url or url,
                  text
              ):
                  if link not in visited:
                      queue.append(link)

              # Be polite to public websites.
              time.sleep(1)


          # ==========================================================
          # Deduplicate
          # ==========================================================

          unique = []
          seen = set()

          for uri in all_configs:

              if not uri.lower().startswith(
                  "vless://"
              ):
                  continue

              if uri in seen:
                  continue

              seen.add(uri)
              unique.append(uri)


          # ==========================================================
          # Sort by resemblance to confirmed working profiles
          # ==========================================================

          ranked = sorted(
              unique,
              key=score_vless,
              reverse=True
          )

          reality = [
              x for x in ranked
              if param(x, "security") == "reality"
          ]

          max_ru = [
              x for x in reality
              if param(x, "sni") == "max.ru"
          ]

          whitelist_sni = [
              x for x in reality
              if param(x, "sni") in PRIORITY_SNI
          ]


          # ==========================================================
          # Output
          # ==========================================================

          out = Path(
              "web_configs"
          )

          out.mkdir(
              exist_ok=True
          )

          for old in out.glob(
              "*.txt"
          ):
              old.unlink()


          def save(name, data):
              Path(
                  out / name
              ).write_text(
                  "\n".join(data)
                  + ("\n" if data else ""),
                  encoding="utf-8"
              )


          save(
              "01_max_ru.txt",
              max_ru
          )

          save(
              "02_whitelist_sni.txt",
              whitelist_sni
          )

          save(
              "03_reality_all.txt",
              reality
          )

          save(
              "04_vless_all.txt",
              ranked
          )


          # ==========================================================
          # Small test batches
          # ==========================================================

          BATCH_SIZE = 50

          for old in out.glob(
              "test_*.txt"
          ):
              old.unlink()

          # Test the highest ranked configs first.
          test_pool = reality

          for i in range(
              0,
              len(test_pool),
              BATCH_SIZE
          ):

              chunk = test_pool[
                  i:i + BATCH_SIZE
              ]

              number = (
                  i // BATCH_SIZE
              ) + 1

              save(
                  f"test_{number:03d}.txt",
                  chunk
              )


          # ==========================================================
          # Human-readable report
          # ==========================================================

          report = [
              f"Pages visited: {len(visited)}",
              f"Unique VLESS: {len(unique)}",
              f"REALITY: {len(reality)}",
              f"Priority whitelist SNI: {len(whitelist_sni)}",
              f"max.ru: {len(max_ru)}",
              "",
              "TOP 100:",
          ]

          for uri in ranked[:100]:

              d = describe(uri)

              report.append(
                  f"{d['score']:4} | "
                  f"SNI={d['sni'] or '-':25} | "
                  f"type={d['transport'] or '-':6} | "
                  f"flow={d['flow'] or '-':20} | "
                  f"fp={d['fp'] or '-'}"
              )

          report.extend([
              "",
              "SOURCE PAGES:"
          ])

          for url, count in source_stats.items():
              report.append(
                  f"{count:5} | {url}"
              )

          save(
              "report.txt",
              report
          )


          print()
          print(
              "Unique VLESS:",
              len(unique)
          )
          print(
              "REALITY:",
              len(reality)
          )
          print(
              "Whitelist SNI:",
              len(whitelist_sni)
          )
          print(
              "max.ru:",
              len(max_ru)
          )

          PY

          python /tmp/collector.py

      - name: Commit updated web configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add web_configs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update VPN configs collected from public websites"
            git push
          fi