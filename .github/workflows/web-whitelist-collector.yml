name: Web Whitelist VPN Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: web-whitelist-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect configs from public websites
        run: |
          cat > /tmp/collector.py <<'PY'
          import base64
          import html
          import re
          import time
          from collections import defaultdict, deque
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup


          START_PAGES = [
              "https://www.v2nodes.com/",
              "https://www.v2nodes.com/country/de/",
              "https://www.v2nodes.com/country/nl/",
              "https://www.v2nodes.com/country/fi/",
              "https://www.v2nodes.com/country/pl/",
              "https://www.v2nodes.com/country/lv/",
              "https://sshstores.net/vless",
              "https://sshstores.net/vless-grpc",
              "https://www.freevpn.us/v2ray/",
          ]


          PRIORITY_SNI = [
              "max.ru",
              "st.vk.com",
              "music.yandex.ru",
              "event.yandex.ru",
              "ads.x5.ru",
          ]

          SNI_SCORE = {
              "max.ru": 100,
              "st.vk.com": 35,
              "music.yandex.ru": 35,
              "event.yandex.ru": 35,
              "ads.x5.ru": 35,
          }


          # Hard limits
          MAX_TOTAL_PAGES = 80
          MAX_PAGES_PER_HOST = 25
          MAX_DEPTH = 1
          MAX_LINKS_FROM_PAGE = 15
          MAX_CONFIGS = 5000

          TIMEOUT = 12
          DELAY = 0.25


          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          session = requests.Session()
          session.headers.update(HEADERS)


          URI_RE = re.compile(
              r'(?:vless|vmess|trojan|ss|ssr|hy2|hysteria2|tuic)'
              r'://[^\s<>"\'\\]+',
              re.I
          )


          def clean_uri(uri):
              uri = html.unescape(uri)
              uri = unquote(uri)
              return uri.rstrip(".,;)]}>'\"").strip()


          def extract_uris(text):
              if not text:
                  return []

              result = []

              versions = {
                  text,
                  unquote(text),
                  html.unescape(text),
              }

              for version in versions:
                  for value in URI_RE.findall(version):
                      result.append(clean_uri(value))

              return result


          def try_base64(text):
              result = []

              if not text:
                  return result

              for block in re.findall(r'[A-Za-z0-9_\-+/=]{100,}', text):
                  try:
                      value = block.replace("-", "+").replace("_", "/")
                      value += "=" * (-len(value) % 4)

                      decoded = base64.b64decode(
                          value,
                          validate=False
                      ).decode("utf-8", errors="ignore")

                      if "vless://" in decoded.lower():
                          result.extend(extract_uris(decoded))

                  except Exception:
                      pass

              return result


          def fetch(url):
              try:
                  print("GET", url, flush=True)

                  r = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  print(
                      " ->",
                      r.status_code,
                      len(r.content),
                      r.url,
                      flush=True
                  )

                  if r.status_code != 200:
                      return None, None

                  # Don't process absurdly huge pages
                  if len(r.content) > 4_000_000:
                      print(" -> skipped: page too large", flush=True)
                      return None, None

                  return r.text, r.url

              except Exception as exc:
                  print("FAILED:", exc, flush=True)
                  return None, None


          def candidate_links(page_url, text):
              result = []

              try:
                  soup = BeautifulSoup(text, "html.parser")
                  root_host = urlparse(page_url).netloc.lower()

                  for tag in soup.find_all("a"):
                      target = tag.get("href")

                      if not target:
                          continue

                      url = urljoin(page_url, target)
                      parsed = urlparse(url)

                      if parsed.scheme not in ("http", "https"):
                          continue

                      if parsed.netloc.lower() != root_host:
                          continue

                      lower = url.lower()

                      # Ignore obvious irrelevant sections
                      blocked = (
                          "/login",
                          "/register",
                          "/privacy",
                          "/terms",
                          "/contact",
                          "/about",
                          "/knowledgebase/",
                          "/blog/",
                      )

                      if any(x in lower for x in blocked):
                          continue

                      keywords = (
                          "vless",
                          "v2ray",
                          "reality",
                          "grpc",
                          "server",
                          "node",
                          "country",
                          "config",
                      )

                      if not any(k in lower for k in keywords):
                          continue

                      result.append(url)

              except Exception:
                  return []

              return list(dict.fromkeys(result))[:MAX_LINKS_FROM_PAGE]


          def param(uri, name):
              match = re.search(
                  rf'(?:[?&]){re.escape(name)}=([^&#]+)',
                  uri,
                  flags=re.I
              )

              if not match:
                  return ""

              return unquote(match.group(1)).lower()


          def score_vless(uri):
              if not uri.lower().startswith("vless://"):
                  return -10000

              score = 10

              security = param(uri, "security")
              transport = param(uri, "type")
              sni = param(uri, "sni")
              flow = param(uri, "flow")
              fp = param(uri, "fp")

              if security == "reality":
                  score += 100
              else:
                  score -= 80

              if transport == "grpc":
                  score += 35
              elif transport in ("tcp", "raw"):
                  score += 20

              if "xtls-rprx-vision" in flow:
                  score += 35

              if sni in SNI_SCORE:
                  score += SNI_SCORE[sni]

              if re.search(r'@[^\s/:?#]+:443(?:[/?#])', uri):
                  score += 15

              if fp in (
                  "chrome",
                  "firefox",
                  "edge",
                  "safari",
                  "qq",
                  "random",
              ):
                  score += 2

              return score


          def describe(uri):
              return {
                  "score": score_vless(uri),
                  "sni": param(uri, "sni"),
                  "security": param(uri, "security"),
                  "transport": param(uri, "type"),
                  "flow": param(uri, "flow"),
                  "fp": param(uri, "fp"),
              }


          # -----------------------------------
          # Crawl
          # -----------------------------------

          queue = deque()

          for url in START_PAGES:
              queue.append((url, 0))

          visited = set()
          pages_per_host = defaultdict(int)
          source_stats = {}
          all_configs = []

          while queue and len(visited) < MAX_TOTAL_PAGES:

              url, depth = queue.popleft()

              if url in visited:
                  continue

              host = urlparse(url).netloc.lower()

              if pages_per_host[host] >= MAX_PAGES_PER_HOST:
                  continue

              visited.add(url)
              pages_per_host[host] += 1

              text, final_url = fetch(url)

              if not text:
                  continue

              found = []
              found.extend(extract_uris(text))
              found.extend(try_base64(text))

              try:
                  soup = BeautifulSoup(text, "html.parser")

                  found.extend(
                      extract_uris(
                          soup.get_text("\n")
                      )
                  )

                  for tag in soup.find_all(True):
                      for value in tag.attrs.values():

                          if isinstance(value, str):
                              found.extend(extract_uris(value))

                          elif isinstance(value, list):
                              for item in value:
                                  if isinstance(item, str):
                                      found.extend(extract_uris(item))

              except Exception:
                  pass

              found = [
                  clean_uri(x)
                  for x in found
                  if x
              ]

              source_stats[url] = len(found)
              all_configs.extend(found)

              print(
                  f"FOUND {len(found)} configs | "
                  f"total raw={len(all_configs)} | "
                  f"pages={len(visited)}/{MAX_TOTAL_PAGES}",
                  flush=True
              )

              if len(all_configs) >= MAX_CONFIGS:
                  print("Reached config limit", flush=True)
                  break

              # Follow only one level from start pages
              if depth < MAX_DEPTH:
                  for link in candidate_links(
                      final_url or url,
                      text
                  ):
                      if link not in visited:
                          queue.append((link, depth + 1))

              time.sleep(DELAY)


          # -----------------------------------
          # Deduplicate
          # -----------------------------------

          unique = []
          seen = set()

          for uri in all_configs:

              if not uri.lower().startswith("vless://"):
                  continue

              if uri in seen:
                  continue

              seen.add(uri)
              unique.append(uri)


          ranked = sorted(
              unique,
              key=score_vless,
              reverse=True
          )


          reality = [
              x for x in ranked
              if param(x, "security") == "reality"
          ]


          max_ru = [
              x for x in reality
              if param(x, "sni") == "max.ru"
          ]


          whitelist_sni = [
              x for x in reality
              if param(x, "sni") in PRIORITY_SNI
          ]


          out = Path("web_configs")
          out.mkdir(exist_ok=True)


          for old in out.glob("*.txt"):
              old.unlink()


          def save(name, data):
              (out / name).write_text(
                  "\n".join(data)
                  + ("\n" if data else ""),
                  encoding="utf-8"
              )


          save("01_max_ru.txt", max_ru)
          save("02_whitelist_sni.txt", whitelist_sni)
          save("03_reality_all.txt", reality)
          save("04_vless_all.txt", ranked)


          # Small batches for Karing
          BATCH_SIZE = 50

          for i in range(0, len(reality), BATCH_SIZE):
              chunk = reality[i:i + BATCH_SIZE]

              number = (i // BATCH_SIZE) + 1

              save(
                  f"test_{number:03d}.txt",
                  chunk
              )


          report = [
              f"Pages visited: {len(visited)}",
              f"Unique VLESS: {len(unique)}",
              f"REALITY: {len(reality)}",
              f"Priority whitelist SNI: {len(whitelist_sni)}",
              f"max.ru: {len(max_ru)}",
              "",
              "Pages per host:",
          ]


          for host, count in sorted(
              pages_per_host.items()
          ):
              report.append(
                  f"{host}: {count}"
              )


          report.extend([
              "",
              "TOP 100:"
          ])


          for uri in ranked[:100]:

              d = describe(uri)

              report.append(
                  f"{d['score']:4} | "
                  f"SNI={d['sni'] or '-':25} | "
                  f"type={d['transport'] or '-':7} | "
                  f"flow={d['flow'] or '-':20} | "
                  f"fp={d['fp'] or '-'}"
              )


          report.extend([
              "",
              "SOURCE PAGES:"
          ])


          for url, count in source_stats.items():
              report.append(
                  f"{count:5} | {url}"
              )


          save(
              "report.txt",
              report
          )


          print()
          print("DONE")
          print("Pages visited:", len(visited))
          print("Unique VLESS:", len(unique))
          print("REALITY:", len(reality))
          print("Whitelist SNI:", len(whitelist_sni))
          print("max.ru:", len(max_ru))
          PY

          python /tmp/collector.py

      - name: Commit updated web configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add web_configs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update VPN configs collected from public websites"
            git push
          fi