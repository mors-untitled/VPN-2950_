name: Rank VPN by known working networks

on:
  workflow_dispatch:
  schedule:
    # Основной web collector у нас запускается на 23-й минуте.
    # Этот запускаем позже, чтобы он обработал свежий результат.
    - cron: "31 * * * *"

permissions:
  contents: write

concurrency:
  group: rank-known-networks
  cancel-in-progress: true

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rank collected VLESS configs
        shell: python
        run: |
          import ipaddress
          import re
          import socket
          import urllib.parse
          from pathlib import Path


          SOURCE = Path("web_configs/04_vless_all.txt")

          if not SOURCE.exists():
              raise SystemExit(
                  "web_configs/04_vless_all.txt not found. "
                  "Run Web Whitelist VPN Collector first."
              )


          # ==========================================================
          # CONFIRMED WORKING ENDPOINTS
          # ==========================================================
          #
          # Это серверы из твоих реально работающих платных профилей.
          #
          # Не утверждаем, что вся подсеть рабочая.
          # Просто используем близость сети как сильный сигнал.
          # ==========================================================

          WORKING_IPS = [
              "185.141.227.178",
              "81.163.22.35",
              "5.188.115.5",
          ]


          # /24 соответствующих рабочих серверов.
          WORKING_NETWORKS_24 = [
              ipaddress.ip_network(
                  ip + "/24",
                  strict=False
              )
              for ip in WORKING_IPS
          ]


          # Более широкий fallback.
          WORKING_NETWORKS_16 = [
              ipaddress.ip_network(
                  ip + "/16",
                  strict=False
              )
              for ip in WORKING_IPS
          ]


          # ==========================================================
          # CONFIRMED WORKING CHARACTERISTICS
          # ==========================================================

          WORKING_PORTS = {
              443,
              2055,
          }

          WORKING_SNI = {
              "max.ru",
              "ads.x5.ru",
              "event.yandex.ru",
              "music.yandex.ru",
              "st.vk.com",
          }

          WORKING_FP = {
              "chrome",
              "firefox",
              "edge",
              "safari",
              "qq",
              "random",
          }


          # ==========================================================
          # URI parsing
          # ==========================================================

          def first(query, key):
              value = query.get(key, [""])[0]

              return urllib.parse.unquote(
                  value
              ).lower().strip()


          def parse_vless(uri):
              try:
                  parsed = urllib.parse.urlsplit(uri)

                  query = urllib.parse.parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  return {
                      "uri": uri,
                      "host": parsed.hostname or "",
                      "port": parsed.port or 0,

                      "security": first(
                          query,
                          "security"
                      ),

                      "transport": first(
                          query,
                          "type"
                      ),

                      "flow": first(
                          query,
                          "flow"
                      ),

                      "sni": (
                          first(query, "sni")
                          or first(query, "serverName")
                      ),

                      "fp": first(
                          query,
                          "fp"
                      ),

                      "pbk": first(
                          query,
                          "pbk"
                      ),

                      "sid": first(
                          query,
                          "sid"
                      ),
                  }

              except Exception:
                  return None


          # ==========================================================
          # DNS resolver
          # ==========================================================

          dns_cache = {}


          def resolve_host(host):
              if not host:
                  return []

              if host in dns_cache:
                  return dns_cache[host]

              # Already IP
              try:
                  ip = ipaddress.ip_address(host)

                  if ip.version == 4:
                      dns_cache[host] = [str(ip)]
                      return [str(ip)]

              except ValueError:
                  pass

              result = []

              try:
                  answers = socket.getaddrinfo(
                      host,
                      None,
                      family=socket.AF_INET,
                      type=socket.SOCK_STREAM
                  )

                  for answer in answers:
                      ip = answer[4][0]

                      if ip not in result:
                          result.append(ip)

              except Exception:
                  pass

              dns_cache[host] = result

              return result


          # ==========================================================
          # Network scoring
          # ==========================================================

          def network_score(ips):
              best = 0
              reason = ""

              for text_ip in ips:
                  try:
                      ip = ipaddress.ip_address(
                          text_ip
                      )
                  except ValueError:
                      continue

                  # Exact endpoint
                  if str(ip) in WORKING_IPS:
                      return (
                          200,
                          "EXACT-WORKING-IP"
                      )

                  # Same /24
                  for network in WORKING_NETWORKS_24:
                      if ip in network:
                          if best < 100:
                              best = 100
                              reason = "SAME-/24"

                  # Same /16
                  for network in WORKING_NETWORKS_16:
                      if ip in network:
                          if best < 35:
                              best = 35
                              reason = "SAME-/16"

              return best, reason


          # ==========================================================
          # Full score
          # ==========================================================

          def score_config(config):
              score = 0
              reasons = []

              ips = resolve_host(
                  config["host"]
              )

              n_score, n_reason = network_score(
                  ips
              )

              score += n_score

              if n_reason:
                  reasons.append(
                      n_reason
                  )


              # VLESS + REALITY
              if config["security"] == "reality":
                  score += 45
                  reasons.append(
                      "REALITY"
                  )
              else:
                  score -= 50


              # Confirmed working architectures
              if config["transport"] == "grpc":
                  score += 30
                  reasons.append(
                      "gRPC"
                  )

              elif config["transport"] in (
                  "tcp",
                  "raw",
              ):
                  score += 20
                  reasons.append(
                      "TCP/RAW"
                  )


              if config["flow"] == "xtls-rprx-vision":
                  score += 30
                  reasons.append(
                      "VISION"
                  )


              # Ports
              if config["port"] == 443:
                  score += 20
                  reasons.append(
                      "PORT-443"
                  )

              elif config["port"] == 2055:
                  score += 25
                  reasons.append(
                      "PORT-2055"
                  )


              # SNI is useful, but we already proved
              # that SNI alone does NOT guarantee success.
              if config["sni"] == "max.ru":
                  score += 20
                  reasons.append(
                      "SNI-MAX"
                  )

              elif config["sni"] in WORKING_SNI:
                  score += 10
                  reasons.append(
                      "KNOWN-SNI"
                  )


              # Fingerprint has intentionally tiny weight.
              if config["fp"] in WORKING_FP:
                  score += 2


              # Complete REALITY parameters
              if config["pbk"]:
                  score += 5

              if config["sid"]:
                  score += 5


              return {
                  **config,
                  "ips": ips,
                  "score": score,
                  "reasons": reasons,
              }


          # ==========================================================
          # Read / deduplicate
          # ==========================================================

          unique = []
          seen = set()

          for raw in SOURCE.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines():

              uri = raw.strip()

              if not uri.startswith(
                  "vless://"
              ):
                  continue

              if uri in seen:
                  continue

              seen.add(uri)

              parsed = parse_vless(
                  uri
              )

              if parsed:
                  unique.append(
                      parsed
                  )


          # ==========================================================
          # Score
          # ==========================================================

          ranked = [
              score_config(config)
              for config in unique
          ]

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True
          )


          # ==========================================================
          # Output
          # ==========================================================

          OUTPUT = Path(
              "ranked_configs"
          )

          OUTPUT.mkdir(
              exist_ok=True
          )

          for old in OUTPUT.glob(
              "*.txt"
          ):
              old.unlink()


          def save(name, rows):
              (
                  OUTPUT / name
              ).write_text(
                  "\n".join(
                      row["uri"]
                      for row in rows
                  )
                  + ("\n" if rows else ""),
                  encoding="utf-8"
              )


          # Самый важный файл:
          # 50 лучших кандидатов.
          best_50 = ranked[:50]

          best_100 = ranked[:100]

          # Только кандидаты из близких сетей.
          network_matches = [
              row
              for row in ranked
              if (
                  "EXACT-WORKING-IP"
                  in row["reasons"]
                  or "SAME-/24"
                  in row["reasons"]
                  or "SAME-/16"
                  in row["reasons"]
              )
          ]


          # gRPC + REALITY
          grpc_reality = [
              row
              for row in ranked
              if (
                  row["security"] == "reality"
                  and row["transport"] == "grpc"
              )
          ]


          # Vision + REALITY
          vision_reality = [
              row
              for row in ranked
              if (
                  row["security"] == "reality"
                  and
                  row["flow"] == "xtls-rprx-vision"
              )
          ]


          save(
              "01_best_50.txt",
              best_50
          )

          save(
              "02_best_100.txt",
              best_100
          )

          save(
              "03_network_matches.txt",
              network_matches
          )

          save(
              "04_grpc_reality.txt",
              grpc_reality[:100]
          )

          save(
              "05_vision_reality.txt",
              vision_reality[:100]
          )


          # ==========================================================
          # Diagnostic report
          # ==========================================================

          report = [
              f"Total unique VLESS: {len(unique)}",
              f"Network matches: {len(network_matches)}",
              f"gRPC Reality: {len(grpc_reality)}",
              f"Vision Reality: {len(vision_reality)}",
              "",
              "Known working IPs:",
              *[
                  f"  {ip}"
                  for ip in WORKING_IPS
              ],
              "",
              "TOP 100:",
          ]


          for row in ranked[:100]:

              ips = ",".join(
                  row["ips"]
              ) or "-"

              reasons = ",".join(
                  row["reasons"]
              )

              report.append(
                  f"{row['score']:4} | "
                  f"{row['host']}:{row['port']} | "
                  f"IP={ips} | "
                  f"SNI={row['sni'] or '-'} | "
                  f"type={row['transport'] or '-'} | "
                  f"flow={row['flow'] or '-'} | "
                  f"{reasons}"
              )


          (
              OUTPUT / "report.txt"
          ).write_text(
              "\n".join(report)
              + "\n",
              encoding="utf-8"
          )


          print(
              "Total unique VLESS:",
              len(unique)
          )

          print(
              "Network matches:",
              len(network_matches)
          )

          print(
              "Best 50 generated:",
              len(best_50)
          )

      - name: Commit ranked candidates
        run: |
          git config user.name \
          "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add ranked_configs

          if git diff --cached --quiet; then
            echo "No ranking changes"
          else
            git commit -m \
            "Rank VPN configs by confirmed working networks"

            git push
          fi